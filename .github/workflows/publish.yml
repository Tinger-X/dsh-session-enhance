name: publish

# 打 v* 标签（如 v0.1.1）时自动构建、测试并发布到 npm。
# 首次使用前：Settings → Secrets and variables → Actions → New repository secret
#   Name: NPM_TOKEN
#   Value: 在 npmjs.org 生成的 Automation access token（账号 → Access tokens）
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package structure
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Publish to npm
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
