name: publish

# 打 v* 标签（如 v0.1.1）时自动构建、测试并发布到 npm。
# 使用 NPM OIDC Trusted Publishing，不再需要 NPM_TOKEN secret
on:
  push:
    tags:
      - "v*"


jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # 关键：允许 Actions 获取 OIDC token 对接npm
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package structure
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Publish to npm via OIDC
        run: pnpm publish --no-git-checks
        # 👉 不再设置 NODE_AUTH_TOKEN！OIDC会自动完成认证
